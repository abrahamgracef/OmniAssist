spring.application.name=OmniAssist
server.port = 7337

spring.datasource.url=jdbc:h2:mem:omni;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false


# AI Configuration (Google Gemini OpenAI compatibility, or Groq)
spring.ai.openai.api-key=${GEMINI_API_KEY:${GROQ_API_KEY:mock-api-key}}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.chat.model=${AI_MODEL:gemini-3.5-flash-lite}
spring.ai.openai.chat.temperature=0.2


# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}

spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.compose,https://www.googleapis.com/auth/calendar.readonly,https://www.googleapis.com/auth/calendar.events
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
